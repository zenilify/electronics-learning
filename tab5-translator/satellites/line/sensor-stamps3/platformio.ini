; Sensor node — StampS3 (1.27 mm) on the Grove Breakout · MAC 50:78:7D:CD:64:8C
; pioarduino 55.03.38-1 = arduino-esp32 3.3.8 (already installed on cachy)
[env:sensor]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -I../common
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLINE_STATION=\"EOL-1\"
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CD:64:8C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CD:64:8C-if00
