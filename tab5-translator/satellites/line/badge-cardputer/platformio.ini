; Badge / kanban / andon terminal — Cardputer ADV + Unit RFID2 on the Grove port · MAC 9C:CC:01:E0:EA:68
; Was running Bruce 1.11 (backup cachy ~/t5/backup/line/s3-9CCC01E0EA68-*.bin, sha256 8d971257…; restore = write-flash 0x0)
[env:badge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Cardputer@^1.1.1
  m5stack/M5Unified@^0.2.8
  m5stack/M5GFX@^0.2.10
  https://github.com/kkloesener/MFRC522_I2C.git
build_flags =
  -I../common
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLINE_STATION=\"EOL-1\"
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_9C:CC:01:E0:EA:68-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_9C:CC:01:E0:EA:68-if00
