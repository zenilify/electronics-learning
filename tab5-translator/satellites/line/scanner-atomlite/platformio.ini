; Scanner — AtomS3 Lite on the Atomic QRCode2 Base · MAC 50:78:7D:CE:8B:10
; (the folder keeps the lane's name "scanner-atomlite"; the board is an AtomS3 Lite — Erick D1, 2026-11-10)
[env:scanner]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/m5stack/M5Unit-QRCode.git
build_flags =
  -I../common
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLINE_STATION=\"EOL-1\"
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CE:8B:10-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CE:8B:10-if00
