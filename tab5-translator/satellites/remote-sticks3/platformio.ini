; PAPP remote (sticks3) — PlatformIO + Arduino (pioarduino 55.03.38 = arduino-esp32 3.3.x) + M5Unified. See ../PROTOCOL.md
; Build: pio run   ·   Flash (MAC-checked, backup first): ../tools/flash.sh sticks3
[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DT5R_KIND_STICK
lib_deps = m5stack/M5Unified@0.3.0
lib_extra_dirs = ../remote-common/lib
monitor_speed = 115200

; Same firmware plus transport B (ESP-NOW through satellites/espnow-bridge, PROTOCOL.md §6). Tries the bridge first,
; falls back to Wi-Fi/UDP. Verified S3 <-> S3 on 2026-11-11; the default env above stays the proven 0.1.2.
[env:sticks3-espnow]
extends = env:sticks3
build_flags = ${env:sticks3.build_flags} -DT5R_ESPNOW
