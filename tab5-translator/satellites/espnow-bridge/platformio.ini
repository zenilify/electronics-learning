; PAPP ESP-NOW bridge — any ESP32-S3 with native USB (StampS3, AtomS3 Lite, XIAO ESP32S3). See ../PROTOCOL.md §6.
; pioarduino 55.03.38 = arduino-esp32 3.3.x (ESP-IDF 5.5): same platform pin as the remotes.
; Build: pio run   ·   Flash: pio run -t upload --upload-port /dev/serial/by-id/usb-Espressif_..._<MAC>-if00
[env:bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
monitor_speed = 115200
